name: Backup externo

# Toda noite: cópia do Postgres e das fotos fora do Railway, com restauração
# de teste do dump antes de guardá-lo. Liga quando a variável do repositório
# BACKUP_OFFSITE_ENABLED for "true" e os segredos abaixo existirem — passo a
# passo em docs/seguranca.md ("Backup e restauração").
#
# Segredos (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL      URL do Postgres de produção com um usuário SÓ DE LEITURA
#   BACKUP_AGE_RECIPIENT     chave pública `age` (a privada fica fora do GitHub e do Railway)
#   BACKUP_S3_ENDPOINT       endpoint S3 do bucket de backup (outro provedor: B2, R2, S3)
#   BACKUP_S3_BUCKET         nome do bucket (com versionamento ou object lock e regra de expiração)
#   BACKUP_S3_REGION         região (ou "auto")
#   BACKUP_S3_ACCESS_KEY_ID / BACKUP_S3_SECRET_ACCESS_KEY  credencial que só grava nesse bucket
#   IMAGES_S3_ENDPOINT / IMAGES_S3_BUCKET / IMAGES_S3_ACCESS_KEY_ID / IMAGES_S3_SECRET_ACCESS_KEY  leitura do bucket das fotos
#   API_BASE_URL / OPS_TOKEN registram o resultado em /ops/backup
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-offsite
  cancel-in-progress: false

jobs:
  backup:
    if: vars.BACKUP_OFFSITE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: estoque
          POSTGRES_PASSWORD: estoque
          POSTGRES_DB: restauracao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estoque"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DESTINO: postgres://estoque:estoque@localhost:5432/restauracao
      RCLONE_CONFIG_BACKUP_TYPE: s3
      RCLONE_CONFIG_BACKUP_PROVIDER: Other
      RCLONE_CONFIG_BACKUP_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      RCLONE_CONFIG_BACKUP_REGION: ${{ secrets.BACKUP_S3_REGION }}
      RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_IMAGENS_TYPE: s3
      RCLONE_CONFIG_IMAGENS_PROVIDER: Other
      RCLONE_CONFIG_IMAGENS_ENDPOINT: ${{ secrets.IMAGES_S3_ENDPOINT }}
      RCLONE_CONFIG_IMAGENS_ACCESS_KEY_ID: ${{ secrets.IMAGES_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_IMAGENS_SECRET_ACCESS_KEY: ${{ secrets.IMAGES_S3_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Conferir configuração
        env:
          DB: ${{ secrets.BACKUP_DATABASE_URL }}
          AGE: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          missing=""
          [ -n "$DB" ] || missing="$missing BACKUP_DATABASE_URL"
          [ -n "$AGE" ] || missing="$missing BACKUP_AGE_RECIPIENT"
          [ -n "$BUCKET" ] || missing="$missing BACKUP_S3_BUCKET"
          if [ -n "$missing" ]; then echo "::error::Segredos ausentes:$missing"; exit 1; fi

      - name: Ferramentas (cliente do Postgres 16, age, rclone)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 age rclone

      - name: Dump do Postgres de produção (somente leitura)
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          umask 077
          pg_dump --format=custom --no-owner --file=backup.dump "$BACKUP_DATABASE_URL"
          ls -l backup.dump

      # Backup que nunca foi restaurado é suposição: o dump só vai para o
      # bucket depois de restaurado e conferido aqui. O resultado vai para
      # /ops/backup e zera o alerta backup_desatualizado.
      - name: Restaurar e conferir
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: npm run backup:verify --workspace @estoquesimples/api -- --dump "$GITHUB_WORKSPACE/backup.dump" --target "$DESTINO"

      - name: Cifrar e enviar o dump
        env:
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          umask 077
          stamp="$(date -u +%Y/%m/%d/estoquesimples-%Y%m%dT%H%M%SZ)"
          age --recipient "$AGE_RECIPIENT" --output backup.dump.age backup.dump
          sha256sum backup.dump.age | cut -d' ' -f1 > backup.dump.age.sha256
          rclone copyto backup.dump.age "backup:$BUCKET/db/$stamp.dump.age" --s3-no-check-bucket
          rclone copyto backup.dump.age.sha256 "backup:$BUCKET/db/$stamp.dump.age.sha256" --s3-no-check-bucket
          echo "Enviado: db/$stamp.dump.age"

      # Cópia das fotos: `copy` nunca apaga no destino, então uma foto apagada
      # por engano (ou por um invasor) continua na cópia até a regra de
      # expiração do bucket de backup.
      - name: Copiar fotos dos produtos
        env:
          IMAGES_BUCKET: ${{ secrets.IMAGES_S3_BUCKET }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        if: env.IMAGES_BUCKET != ''
        run: rclone copy "imagens:$IMAGES_BUCKET" "backup:$BUCKET/imagens" --s3-no-check-bucket --transfers 8 --stats-one-line --stats 60s

      - name: Apagar cópias locais
        if: always()
        run: rm -f backup.dump backup.dump.age backup.dump.age.sha256
