name: Android

# O app é um projeto Gradle à parte dentro do monorepo: só compila quando
# algo dele (ou os documentos legais que ele embute) muda.
on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'packages/legal/**'
      - 'packages/help/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'packages/legal/**'
      - 'packages/help/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Compilar (debug) e rodar os testes unitários
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
