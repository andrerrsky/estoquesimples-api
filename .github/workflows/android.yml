name: Android

# O app é um projeto Gradle à parte dentro do monorepo: só compila quando
# algo dele (ou os documentos legais que ele embute) muda.
on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'packages/legal/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'packages/legal/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar (debug) e rodar os testes unitários
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
