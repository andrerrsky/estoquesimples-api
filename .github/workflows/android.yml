name: Android

# O app é um projeto Gradle à parte dentro do monorepo: só compila quando
# algo dele (ou os documentos legais que ele embute) muda.
on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'packages/legal/**'
      - 'packages/help/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'packages/legal/**'
      - 'packages/help/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compilar (debug) e rodar os testes unitários
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
