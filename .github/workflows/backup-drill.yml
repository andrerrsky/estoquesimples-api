name: Exercício de restauração

# Semanal, e sob demanda. O objetivo não é testar o Postgres: é garantir que o
# procedimento de restauração continua funcionando com o schema atual, e que
# quem precisar executá-lo às três da manhã tenha um roteiro já exercitado.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  # Mudanças que podem quebrar a restauração rodam o exercício no próprio PR.
  pull_request:
    paths:
      - 'apps/api/src/platform/db/migrations/**'
      - 'apps/api/src/platform/db/verify-backup.ts'
      - 'apps/api/src/platform/db/migrate.ts'
      - 'apps/api/scripts/seed-drill.ts'
      - '.github/workflows/backup-*.yml'

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-24.04  # fixo: a instalação das ferramentas depende da versão do Ubuntu

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: estoque
          POSTGRES_PASSWORD: estoque
          POSTGRES_DB: estoquesimples_origem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estoque"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ORIGEM: postgres://estoque:estoque@localhost:5432/estoquesimples_origem
      DESTINO: postgres://estoque:estoque@localhost:5432/estoquesimples_restaurado
      PGPASSWORD: estoque

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A versão do cliente precisa acompanhar a do servidor: pg_restore antigo
      # recusa dumps gerados por um servidor mais novo, e descobrir isso durante
      # um incidente custa horas.
      - name: Cliente do Postgres 16
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Schema e dados de exercício
        working-directory: apps/api
        run: npx tsx src/platform/db/migrate.ts up && npx tsx scripts/seed-drill.ts
        env:
          DATABASE_URL: ${{ env.ORIGEM }}

      # Mesmo caminho da produção (docs/seguranca.md): o dump é feito por um
      # usuário só de leitura. Se a receita de permissões dele quebrar a
      # restauração (GRANTs a papéis que o alvo não tem), o exercício falha aqui.
      - name: Usuário de backup só de leitura (receita de docs/seguranca.md)
        run: |
          psql "$ORIGEM" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE backup_reader LOGIN PASSWORD 'leitura';
          GRANT CONNECT ON DATABASE estoquesimples_origem TO backup_reader;
          GRANT pg_read_all_data TO backup_reader;
          ALTER ROLE backup_reader BYPASSRLS;
          ALTER ROLE backup_reader SET default_transaction_read_only = on;
          SQL

      - name: Gerar o dump (como backup_reader)
        run: pg_dump --format=custom --no-owner --file=backup.dump "postgres://backup_reader:leitura@localhost:5432/estoquesimples_origem"

      - name: Banco descartável para a restauração
        run: psql "$ORIGEM" -c 'CREATE DATABASE estoquesimples_restaurado'

      - name: Restaurar e conferir
        run: npm run backup:verify --workspace @estoquesimples/api -- --dump "$GITHUB_WORKSPACE/backup.dump" --target "$DESTINO"

      - name: Guardar o dump do exercício
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-dump
          path: backup.dump
          retention-days: 3
